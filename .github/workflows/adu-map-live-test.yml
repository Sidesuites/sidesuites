name: ADU map live test

# Opens the ADU map (staff) and Check My Lot (customer page) in a real browser and
# checks known addresses against their expected ratings, using the live county GIS
# servers. The customer step also opens Check My Lot with ?address= and expects the
# check to run by itself. Runs after every GitHub Pages deploy and on demand from the
# Actions tab. With "serve_local" it tests the checked-out branch from a local web
# server instead of the deployed site, so a change can be verified before it is merged.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Page to test'
        default: 'https://sidesuites.com/internal/adu-map/'
      serve_local:
        description: 'Test this branch from a local server instead (true/false)'
        default: 'false'
      lotimg_max:
        description: 'Print this many small lot drawings into the log'
        default: '0'
      lotimg_cases:
        description: 'Or print the lot drawings of these case numbers (comma list)'
        default: ''
      only:
        description: 'Test only these addresses instead of the saved list (separate with |)'
        default: ''
  workflow_run:
    workflows: ['pages-build-deployment']
    types: [completed]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Wait for the new version to be served
        if: github.event_name == 'workflow_run'
        run: sleep 60
      - name: Start a local server
        if: inputs.serve_local == 'true'
        run: (python3 -m http.server 8080 --bind 127.0.0.1 > /dev/null 2>&1 &) && sleep 2
      - name: Run live test
        env:
          PAGE_URL: ${{ inputs.serve_local == 'true' && 'http://127.0.0.1:8080/internal/adu-map/index.html' || inputs.url || 'https://sidesuites.com/internal/adu-map/' }}
          LOTIMG_MAX: ${{ inputs.lotimg_max || '0' }}
          LOTIMG_CASES: ${{ inputs.lotimg_cases || '' }}
          ONLY: ${{ inputs.only || '' }}
        run: node tools/adu/tests/live_test.js "$PAGE_URL?nocache=${{ github.run_id }}" tools/adu/tests/addresses.json report.md
      - name: Run customer page test
        if: always()
        env:
          PAGE_URL: ${{ inputs.serve_local == 'true' && 'http://127.0.0.1:8080/check-my-lot/index.html' || 'https://sidesuites.com/check-my-lot/' }}
          MODE: customer
          AUTORUN: ${{ !inputs.only && '4040 NW 196th St, Miami Gardens, FL 33055' || '' }}
          LOTIMG_MAX: ${{ inputs.lotimg_max || '0' }}
          ONLY: ${{ inputs.only || '' }}
        run: mkdir -p customer && cd customer && node ../tools/adu/tests/live_test.js "$PAGE_URL?nocache=${{ github.run_id }}" ../tools/adu/tests/customer_cases.json ../report-customer.md
      - if: always()
        run: cat report.md report-customer.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          path: |
            report.md
            report-customer.md
            live-test-results.json
            shots/
            customer/
