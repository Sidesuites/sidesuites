name: GIS probe

# Fetches public map-service URLs (GET only) and prints the responses, so new
# city zoning layers can be checked without a scraping service. Run it from the
# Actions tab with one URL per line.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'One URL per line (ArcGIS REST ?f=json / /query URLs, city GIS pages)'
        required: true
      grep:
        description: 'Optional regex: print only the matching snippets of each response (grep -oE)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
          GREP: ${{ inputs.grep }}
        run: |
          mkdir -p out; i=0
          printf '%s\n' "$URLS" | tr ' ' '\n' | grep -E '^https?://' | head -n 40 | while IFS= read -r u; do
            i=$((i+1))
            code=$(curl -sS -L -m 40 -A 'ToolyADUProbe/1.0 (+https://toolystructures.com)' -H 'Origin: https://toolystructures.com' -D "out/$i.h" -o "out/$i.txt" -w '%{http_code} %{content_type}' -- "$u" || echo "curl-failed")
            cors=$(grep -i '^access-control-allow-origin' "out/$i.h" 2>/dev/null | tail -1 | tr -d '\r' || true)
            echo "===== [$i] $code [cors: ${cors:-none}] $u"
            if [ -n "$GREP" ]; then grep -oE -- "$GREP" "out/$i.txt" | awk '!seen[$0]++' | head -n 300; else head -c 6000 "out/$i.txt"; fi; echo
            printf '%s\t%s\n' "$i" "$u" >> out/index.tsv
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gis-probe
          path: out/
