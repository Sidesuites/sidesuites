<main id="main" tabindex="-1">
<section class="tm">

  <div id="loginView">
    <h1>Team login</h1>
    <p class="sub">For the Sidesuites team only.</p>
    <form class="login" id="loginForm" novalidate>
      <div><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
      <div><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-primary btn-lg" id="lBtn">Log in</button>
      <div class="tm-msg" id="lMsg" role="alert"></div>
    </form>
  </div>

  <div id="appView" hidden>
    <div class="tm-bar">
      <h1 style="margin:0">Team dashboard</h1>
      <div class="tools" style="margin:0">
        <a class="btn btn-secondary btn-sm2" id="sheetLink" href="#" target="_blank" rel="noopener" hidden>Open Google Sheet</a>
        <button type="button" class="btn btn-secondary btn-sm2" id="refresh">Refresh</button>
        <button type="button" class="btn btn-ghost btn-sm2" id="logout">Log out</button>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="Team data">
      <button class="tab" role="tab" id="t-wait" aria-controls="p-wait" aria-selected="true">Waitlist<span class="n" id="nWait"></span></button>
      <button class="tab" role="tab" id="t-look" aria-controls="p-look" aria-selected="false" tabindex="-1">Lookups by likelihood<span class="n" id="nLook"></span></button>
      <button class="tab" role="tab" id="t-calls" aria-controls="p-calls" aria-selected="false" tabindex="-1">Booked calls<span class="n" id="nCalls"></span></button>
      <button class="tab" role="tab" id="t-map" aria-controls="p-map" aria-selected="false" tabindex="-1">Heat map</button>
    </div>

    <div role="tabpanel" id="p-wait" aria-labelledby="t-wait">
      <div class="tools"><input class="tm-search" id="qWait" type="search" placeholder="Search name, email, address…" aria-label="Search the waitlist"><button type="button" class="btn btn-secondary btn-sm2" data-csv="waitlist">Download CSV</button></div>
      <div id="wait"></div>
    </div>
    <div role="tabpanel" id="p-look" aria-labelledby="t-look" hidden>
      <div class="stats" id="lookStats"></div>
      <div class="tools"><input class="tm-search" id="qLook" type="search" placeholder="Search address, city, ZIP…" aria-label="Search lookups"><button type="button" class="btn btn-secondary btn-sm2" data-csv="lookups">Download CSV</button></div>
      <div id="look"></div>
    </div>
    <div role="tabpanel" id="p-calls" aria-labelledby="t-calls" hidden>
      <div class="tools"><button type="button" class="btn btn-secondary btn-sm2" data-csv="bookings">Download CSV</button></div>
      <div id="calls"></div>
    </div>
    <div role="tabpanel" id="p-map" aria-labelledby="t-map" hidden>
      <p class="sub">The ADU targeting heat map. Use <b>Batch check</b> in its side panel to paste a list of addresses or folios and export the results. <a href="/internal/adu-map/" target="_blank" rel="noopener">Open it full screen</a>.</p>
      <iframe class="map-frame" id="mapFrame" title="ADU targeting heat map" loading="lazy"></iframe>
    </div>
  </div>

</section>

<script>
(function(){
  var $=function(id){return document.getElementById(id);}, KEY='ss-team-token', data=null, lookFilter='';
  var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var fDate=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
  var when=function(v){ var d=new Date(v); return isNaN(d)?esc(v):fDate.format(d); };
  var GROUPS=[['Highly likely','l-hl','#1D5A35'],['Likely','l-lk','#5E8C3A'],['Unlikely','l-un','#8A2A18'],['Outside service area','l-out','#5D6D7E'],['Address not found','l-nf','#C9A27A']];
  function token(){ try{ return sessionStorage.getItem(KEY); }catch(e){ return null; } }
  function setToken(t){ try{ t?sessionStorage.setItem(KEY,t):sessionStorage.removeItem(KEY); }catch(e){} }
  function show(app){ $('loginView').hidden=app; $('appView').hidden=!app; }

  $('loginForm').addEventListener('submit',function(e){
    e.preventDefault(); var m=$('lMsg'), b=$('lBtn'); m.textContent='';
    if(!SSTeam.configured()){ m.textContent='The team backend isn\'t connected yet. See tools/team-backend/README.md.'; return; }
    b.disabled=true; b.textContent='Logging in…';
    SSTeam.post('login',{email:$('lEmail').value,password:$('lPass').value}).then(function(r){
      b.disabled=false; b.textContent='Log in';
      if(!r.ok){ m.textContent=r.error||'Wrong email or password.'; return; }
      setToken(r.token); $('lPass').value=''; fetchData();
    }).catch(function(){ b.disabled=false; b.textContent='Log in'; m.textContent='Couldn\'t reach the server. Try again.'; });
  });
  $('logout').addEventListener('click',function(){ setToken(null); data=null; show(false); $('lEmail').focus(); });
  $('refresh').addEventListener('click',fetchData);

  function fetchData(){
    var t=token(); if(!t){ show(false); return; }
    SSTeam.post('data',{token:t}).then(function(r){
      if(!r.ok){ setToken(null); show(false); $('lMsg').textContent=r.error||'Please log in again.'; return; }
      data=r; show(true); render();
      if(r.sheet){ $('sheetLink').href=r.sheet; $('sheetLink').hidden=false; }
    }).catch(function(){ show(false); $('lMsg').textContent='Couldn\'t reach the server. Try again.'; });
  }

  function table(rows, cols){
    if(!rows.length) return '<p class="empty">Nothing here yet.</p>';
    return '<div class="tbl-wrap"><table class="tm-t"><thead><tr>'+cols.map(function(c){return '<th scope="col">'+esc(c[0])+'</th>';}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){ return '<tr>'+cols.map(function(c){ return '<td>'+(c[1]?c[1](r):esc(r[c[0]]))+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div>';
  }
  function match(r,q){ if(!q) return true; q=q.toLowerCase(); return Object.keys(r).some(function(k){ return String(r[k]).toLowerCase().indexOf(q)>=0; }); }
  function newest(a){ return a.slice().sort(function(x,y){ return new Date(y.Received)-new Date(x.Received); }); }
  function pill(v){ var g=GROUPS.filter(function(x){return x[0]===v;})[0]; return '<span class="pill '+(g?g[1]:'l-out')+'">'+esc(v||'—')+'</span>'; }

  function render(){
    var w=newest(data.waitlist), q=$('qWait').value.trim();
    $('nWait').textContent=w.length; $('nLook').textContent=data.lookups.length; $('nCalls').textContent=data.bookings.length;
    $('wait').innerHTML=table(w.filter(function(r){return match(r,q);}),[['Received',function(r){return when(r.Received);}],['Name'],['Email',function(r){return r.Email?'<a href="mailto:'+esc(r.Email)+'">'+esc(r.Email)+'</a>':'';}],['Phone'],['Address',function(r){return esc([r.Address,r.City,r.ZIP].filter(Boolean).join(', '));}],['Request'],['Lot check'],['Use'],['Payment'],['Reserve'],['Source']]);
    // lookups: counts per likelihood (click to filter), then one table per likelihood
    var L=newest(data.lookups), lq=$('qLook').value.trim();
    var count=function(name){ return L.filter(function(r){return r.Likelihood===name;}).length; };
    $('lookStats').innerHTML=GROUPS.map(function(g){ return '<button type="button" class="stat" data-g="'+esc(g[0])+'" aria-pressed="'+(lookFilter===g[0])+'"><b>'+count(g[0])+'</b><span><i style="background:'+g[2]+'"></i>'+esc(g[0])+'</span></button>'; }).join('');
    var cols=[['Received',function(r){return when(r.Received);}],['Address'],['City'],['ZIP'],['Folio'],['County'],['Likelihood',function(r){return pill(r.Likelihood);}],['Detail']];
    var names=GROUPS.map(function(g){return g[0];}), other=L.filter(function(r){return names.indexOf(r.Likelihood)<0;});
    var groups=GROUPS.map(function(g){return g[0];}).concat(other.length?['Other']:[]);
    $('look').innerHTML=groups.filter(function(n){return !lookFilter||lookFilter===n;}).map(function(n){
      var rows=(n==='Other'?other:L.filter(function(r){return r.Likelihood===n;})).filter(function(r){return match(r,lq);});
      return '<h2 class="group-h">'+esc(n)+' · '+rows.length+'</h2>'+table(rows,cols);
    }).join('');
    var B=data.bookings.slice().sort(function(x,y){return new Date(x.Start)-new Date(y.Start);}), now=Date.now();
    var up=B.filter(function(r){return new Date(r.Start)>=now;}), past=B.filter(function(r){return new Date(r.Start)<now;}).reverse();
    var bc=[['Call time',function(r){return when(r.Start);}],['Name'],['Email',function(r){return r.Email?'<a href="mailto:'+esc(r.Email)+'">'+esc(r.Email)+'</a>':'';}],['Phone'],['Address'],['Notes'],['Booked',function(r){return when(r.Received);}]];
    $('calls').innerHTML='<h2 class="group-h">Upcoming · '+up.length+'</h2>'+table(up,bc)+'<h2 class="group-h">Past · '+past.length+'</h2>'+table(past,bc);
  }
  $('qWait').addEventListener('input',function(){ if(data) render(); });
  $('qLook').addEventListener('input',function(){ if(data) render(); });
  $('lookStats').addEventListener('click',function(e){ var b=e.target.closest('.stat'); if(!b) return; lookFilter=lookFilter===b.dataset.g?'':b.dataset.g; render(); });

  // CSV export of what the backend returned
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-csv]'); if(!b||!data) return;
    var rows=data[b.dataset.csv]||[]; if(!rows.length) return;
    var cols=Object.keys(rows[0]), q=function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    var csv=[cols.map(q).join(',')].concat(rows.map(function(r){return cols.map(function(c){return q(r[c]);}).join(',');})).join('\n');
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='sidesuites-'+b.dataset.csv+'-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  });

  // tabs (arrow keys move between them)
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  function sel(t){ tabs.forEach(function(x){ var on=x===t; x.setAttribute('aria-selected',on); x.tabIndex=on?0:-1; $(x.getAttribute('aria-controls')).hidden=!on; });
    if(t.id==='t-map' && !$('mapFrame').src) $('mapFrame').src='/internal/adu-map/'; }
  tabs.forEach(function(t,i){ t.addEventListener('click',function(){sel(t);}); t.addEventListener('keydown',function(e){ var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0; if(!d) return; var n=tabs[(i+d+tabs.length)%tabs.length]; sel(n); n.focus(); }); });

  if(token()) fetchData(); else show(false);
})();
</script>
</main>
